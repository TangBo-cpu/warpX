<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WrapX M2 Multi-session Sidebar</title>
    <style>
      html,
      body,
      #root {
        width: 100%;
        height: 100%;
        margin: 0;
        background: #0d0e0b;
      }

      .boot-screen {
        display: grid;
        width: 100%;
        height: 100%;
        place-content: center;
        gap: 10px;
        color: #f4efe6;
        background:
          radial-gradient(circle at 18% 12%, rgba(113, 91, 58, 0.22), transparent 34%),
          radial-gradient(circle at 78% 0%, rgba(42, 73, 57, 0.28), transparent 32%),
          #0d0e0b;
        font-family: Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .boot-title {
        font-size: 18px;
        font-weight: 800;
        letter-spacing: 0.01em;
      }

      .boot-subtitle {
        color: #92887c;
        font-size: 13px;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-screen">
        <div class="boot-title">WrapX</div>
        <div class="boot-subtitle">Starting agent flight deck...</div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
